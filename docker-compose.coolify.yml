services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opendots}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-opendots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opendots}
      BOAT_API_KEY: ${BOAT_API_KEY}
      BOAT_ORG_ID: ${BOAT_ORG_ID:-}
      TOKEN_ENCRYPTION_KEYS: ${TOKEN_ENCRYPTION_KEYS}
      HOOK_TOKEN: ${HOOK_TOKEN}
      PERMISSION_HOOK_BASE_URL: ${PERMISSION_HOOK_BASE_URL}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      PARALLEL_SEARCH_ENABLED: ${PARALLEL_SEARCH_ENABLED:-false}
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"

volumes:
  postgres_data:
